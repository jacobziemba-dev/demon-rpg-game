name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  godot-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.6 headless
        run: |
          GODOT_TAG="4.6-stable"
          GODOT_BIN="Godot_v${GODOT_TAG}_linux.x86_64"
          curl -fL --retry 3 --retry-delay 5 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/${GODOT_BIN}.zip" \
            -o godot.zip
          unzip -q godot.zip
          mv "${GODOT_BIN}" godot
          chmod +x godot
      - name: Validate GDScript (headless)
        run: |
          ./godot --headless --path . --quit 2>&1 | tee godot_output.txt
          ! grep -qE "^ERROR:" godot_output.txt
