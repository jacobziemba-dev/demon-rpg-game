name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gdlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install gdtoolkit==4.*
      - run: gdlint scripts/
      - run: gdformat --check scripts/
