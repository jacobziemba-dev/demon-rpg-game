name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  godot-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.6 headless
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip -q Godot_v4.6-stable_linux.x86_64.zip
          mv Godot_v4.6-stable_linux.x86_64 godot
          chmod +x godot
      - name: Import project (headless)
        run: |
          ./godot --headless --path . --quit 2>&1 | tee godot_output.txt
          ! grep -qE "^ERROR:" godot_output.txt
