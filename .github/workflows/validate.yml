name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  godot-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.6 headless
        run: |
          GODOT_TAG="4.6-stable"
          # Resolve the Linux x86_64 editor zip URL from the release asset list.
          # jq is pre-installed on GitHub Actions ubuntu runners.
          DOWNLOAD_URL=$(curl -fsSL \
            "https://api.github.com/repos/godotengine/godot/releases/tags/${GODOT_TAG}" \
            | jq -r '[
                .assets[]
                | select(.name | test("linux.*x86_64.*\\.zip$"; "i"))
                | select(.name | test("export|template"; "i") | not)
                | .browser_download_url
              ][0]')
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "ERROR: no Linux x86_64 zip found in ${GODOT_TAG} release assets"
            exit 1
          fi
          echo "Downloading: $DOWNLOAD_URL"
          curl -fL --retry 3 --retry-delay 5 -o godot.zip "$DOWNLOAD_URL"
          unzip -q godot.zip
          GODOT_BIN=$(find . -maxdepth 1 -name "Godot_v*" -type f | head -1)
          echo "Binary: $GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Validate GDScript (headless)
        run: |
          "$GODOT_BIN" --headless --path . --quit 2>&1 | tee godot_output.txt
          ! grep -qE "^ERROR:" godot_output.txt
